name: Build PKHeX.MAUI Gen7 Expansion (original UI)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-maui-expansion.yml'
      - 'scripts/prepare-pkhex-maui.ps1'
      - 'scripts/patch-pkhax-updates.py'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - name: Checkout integration scripts
        uses: actions/checkout@v4
      - name: Checkout original PKHeX.MAUI source (same UI, 5k+ sprites)
        uses: actions/checkout@v4
        with:
          repository: santacrab2/PKHeXMAUI
          ref: a6f7cfb78e1c96155baa67660fd7ae97895e375f
          path: PKHeXMAUI
          persist-credentials: false
      - name: Checkout Aqua-0 Gen7 Expansion v1.0 Core
        uses: actions/checkout@v4
        with:
          repository: Aqua-0/PKHeX
          ref: v1.0
          path: ExpansionCore
          persist-credentials: false
      - name: Integrate expansion engine into full MAUI interface
        shell: pwsh
        run: ./scripts/prepare-pkhex-maui.ps1
      - name: Install .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore Android workload
        shell: pwsh
        run: dotnet workload restore PKHeXMAUI/PKHeX.MAUI.csproj
      - name: Build stand-alone Android APK
        shell: pwsh
        run: |
          dotnet build PKHeXMAUI/PKHeX.MAUI.csproj -c Debug -f net10.0-android36.0 -p:AndroidPackageFormats=apk -p:EmbedAssembliesIntoApk=true -p:AndroidUseSharedRuntime=false
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: PKHeX-MAUI-OriginalUI-Gen7Expansion-Debug-APK
          path: PKHeXMAUI/bin/Debug/net10.0-android36.0/**/*.apk
          if-no-files-found: error
          retention-days: 14

  sign-and-smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download current build artifact
        uses: actions/download-artifact@v4
        with:
          name: PKHeX-MAUI-OriginalUI-Gen7Expansion-Debug-APK
          path: ./from-build

      - name: Sign standalone APK
        shell: bash
        run: |
          set -euxo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -1)"
          ZIPALIGN="$(find "$SDK/build-tools" -type f -name zipalign | sort -V | tail -1)"
          INPUT="$(find ./from-build -type f -iname '*.apk' -print -quit)"
          test -f "$APKSIGNER"
          test -f "$ZIPALIGN"
          test -f "$INPUT"
          "$ZIPALIGN" -p -f 4 "$INPUT" ./aligned.apk
          keytool -genkeypair -noprompt -keystore ./ci-debug.keystore -alias androiddebugkey -storepass android -keypass android -dname "CN=PKHeX Gen7 Expansion PKHaX,O=Debug,C=US" -keyalg RSA -keysize 2048 -validity 10000
          "$APKSIGNER" sign --ks ./ci-debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out ./PKHeX-MAUI-Gen7Expansion-PKHaX-v0.4.0-Signed.apk ./aligned.apk
          "$APKSIGNER" verify --verbose ./PKHeX-MAUI-Gen7Expansion-PKHaX-v0.4.0-Signed.apk
          sha256sum ./PKHeX-MAUI-Gen7Expansion-PKHaX-v0.4.0-Signed.apk

      - name: Upload signed APK for Android installation
        uses: actions/upload-artifact@v4
        with:
          name: PKHeX-MAUI-Gen7Expansion-PKHaX-v0.4.0-Signed-APK
          path: ./PKHeX-MAUI-Gen7Expansion-PKHaX-v0.4.0-Signed.apk
          retention-days: 14
          if-no-files-found: error

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Install and verify startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install ./PKHeX-MAUI-Gen7Expansion-PKHaX-v0.4.0-Signed.apk
            adb logcat -c
            adb shell monkey -p org.pkhex.gen7expansion.maui -c android.intent.category.LAUNCHER 1
            sleep 18
            adb logcat -d -v threadtime > ./pkhex-maui-v0.4-startup.log
            grep -iE -m 60 'FATAL EXCEPTION|No assemblies found|F monodroid|Fatal signal' ./pkhex-maui-v0.4-startup.log || true
            adb shell pidof org.pkhex.gen7expansion.maui || { echo 'App process stopped'; exit 1; }

      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PKHeX-MAUI-PKHaX-v0.4.0-Startup-Logs
          path: ./pkhex-maui-v0.4-startup.log
          if-no-files-found: warn
