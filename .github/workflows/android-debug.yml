name: Build Android Debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
      - name: Restore application source from verified bundle
        shell: pwsh
        run: |
          @'
          import base64, hashlib, pathlib, tarfile
          parts = pathlib.Path("source-bundle")
          data = "".join((parts / f"part-{i:02d}.txt").read_text(encoding="utf-8").strip() for i in range(1,5))
          raw = base64.b64decode(data, validate=True)
          expected = "f0b3ac5c648d056d6651cbc96e0cb90a3baf8847c903b581176fcdc4f68e74f7"
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected: raise RuntimeError("Source bundle SHA256 mismatch: " + actual)
          archive = pathlib.Path("application-source.txz")
          archive.write_bytes(raw)
          with tarfile.open(archive, "r:xz") as tar:
              root = pathlib.Path(".").resolve()
              for info in tar.getmembers():
                  target = (root / info.name).resolve()
                  if not target.is_relative_to(root): raise RuntimeError("Unsafe archive path")
              tar.extractall(root, filter="data")
          print("Source restored and SHA256 verified:", actual)
          '@ | python -
          if (-not (Test-Path 'PKHeXExpansion.Mobile/PKHeXExpansion.Mobile.csproj')) {
            throw 'Application project is missing after extraction.'
          }
      - name: Fix .NET MAUI compilation compatibility
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          root = Path("PKHeXExpansion.Mobile")
          program = root / "MauiProgram.cs"
          s = program.read_text(encoding="utf-8")
          s = s.replace("builder.Logging.AddDebug();", "// Logging provider is optional for Android Debug")
          program.write_text(s, encoding="utf-8")

          home = root / "Pages" / "HomePage.cs"
          s = home.read_text(encoding="utf-8")
          if "using Microsoft.Maui.Layouts;" not in s:
              s = "using Microsoft.Maui.Layouts;\n" + s
          home.write_text(s, encoding="utf-8")

          editor = root / "Pages" / "PokemonEditorPage.cs"
          s = editor.read_text(encoding="utf-8")
          s = s.replace("Math.Max(1, _pk.CurrentLevel)", "Math.Max(1, (int)_pk.CurrentLevel)")
          editor.write_text(s, encoding="utf-8")

          project = root / "PKHeXExpansion.Mobile.csproj"
          s = project.read_text(encoding="utf-8")
          if 'PackageReference Include="Microsoft.Maui.Controls"' not in s:
              s = s.replace("</Project>", '  <ItemGroup><PackageReference Include="Microsoft.Maui.Controls" Version="10.0.110" /></ItemGroup>\n</Project>')
          # The debug APK must include assemblies for standalone sideload installation.
          # Otherwise MonoDroid aborts with "No assemblies found ... Fast Deployment".
          if "<EmbedAssembliesIntoApk>" not in s:
              s = s.replace("</PropertyGroup>",
                  "    <EmbedAssembliesIntoApk>true</EmbedAssembliesIntoApk>\n"
                  "    <AndroidUseSharedRuntime>false</AndroidUseSharedRuntime>\n"
                  "  </PropertyGroup>", 1)
          project.write_text(s, encoding="utf-8")
          print("Applied API fixes: logging, FlexLayout namespace, byte/int overload, MAUI package.")
          '@ | python -
      - name: Checkout Aqua-0 PKHeX Expansion v1.0
        uses: actions/checkout@v4
        with:
          repository: Aqua-0/PKHeX
          ref: v1.0
          path: Upstream/PKHeX
          persist-credentials: false
      - name: Install .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore Android workload
        shell: pwsh
        run: dotnet workload restore PKHeXExpansion.Mobile/PKHeXExpansion.Mobile.csproj
      - name: Build standalone Android Debug APK
        shell: pwsh
        run: dotnet build PKHeXExpansion.Mobile/PKHeXExpansion.Mobile.csproj -c Debug -f net10.0-android -p:AndroidPackageFormats=apk -p:EmbedAssembliesIntoApk=true -p:AndroidUseSharedRuntime=false
      - name: Publish installable APK as artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: PKHeX-Gen7-Expansion-Android-Debug
          path: PKHeXExpansion.Mobile/bin/Debug/net10.0-android/**/*.apk
          if-no-files-found: error

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PKHeX-Gen7-Expansion-Android-Debug
          path: ./apk
      - name: Allow KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Install APK and verify app stays open
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install ./apk/org.pkhex.gen7expansion.mobile-Signed.apk
            adb logcat -c
            adb shell monkey -p org.pkhex.gen7expansion.mobile -c android.intent.category.LAUNCHER 1
            sleep 16
            adb logcat -d -v threadtime > ./android-startup-logcat.txt
            echo '=== App fatal errors ==='
            grep -inE 'FATAL EXCEPTION|No assemblies found|F monodroid|mono-rt|Fatal signal|AndroidRuntime.*[eE]xception' ./android-startup-logcat.txt | tail -50 || true
            echo '=== Check app stays open ==='
            adb shell pidof org.pkhex.gen7expansion.mobile
      - name: Upload startup logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Startup-Smoke-Test-Logs
          path: ./android-startup-logcat.txt
          if-no-files-found: warn
